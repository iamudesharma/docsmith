[package]
name = "doc-extractor"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace]
members = ["."]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
hex = "0.4"
roxmltree = "0.20"
base64 = "0.22"
flate2 = "1"
percent-encoding = "2"
pulldown-cmark = "0.13"
regex = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
calamine = { version = "=0.36.1", features = ["picture"] }
zip = { version = "3", default-features = false, features = ["deflate"] }
scraper = "0.24"
mailparse = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart"] }
libc = "0.2"
lopdf = { version = "=0.38.0", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa-swagger-ui = { version = "=10.0.1", features = ["axum", "vendored"] }
tokio-stream = "0.1"
hmac = "0.12"
clap_complete = "4"

[dev-dependencies]
tempfile = "3"
